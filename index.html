<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo de Caixa Consolidado</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            max-width: 800px;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
            width: 100%;
            max-width: 1100px;
        }

        .report-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .report-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .report-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .report-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            font-weight: 700;
        }

        .arrow {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            align-self: flex-end;
        }

        .report-card:hover .arrow {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Fluxo de Caixa Consolidado</h1>
        <p>Acesse as seções na ordem executiva recomendada.</p>
    </header>

    <main class="grid-container">
        
        <!-- 1. Fluxo Consolidado - Grupo Fratelli SF -->
        <a href="fluxoconsolidado.html" class="report-card">
            <div>
                <span class="report-tag">Módulo 01</span>
                <div class="report-title">Fluxo Consolidado - Grupo Fratelli SF</div>
            </div>
            <span class="arrow">Acessar &rarr;</span>
        </a>

</body>
</html>
